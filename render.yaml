services:
  - type: web
    name: sevasetu-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sevasetu-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: OFFICER_DEMO_PASSWORD
        sync: false
      - key: ADMIN_DEMO_PASSWORD
        sync: false

  - type: web
    name: sevasetu-frontend
    runtime: docker
    dockerfilePath: ./frontend-react/Dockerfile
    dockerContext: ./frontend-react
    plan: free
    dockerBuildArgs:
      # Render assigns the backend's real public URL after first deploy —
      # this placeholder has to be replaced with that actual URL and
      # redeployed once. Can't be automated in this file: the URL
      # doesn't exist until the backend service has already been created.
      VITE_API_BASE_URL: https://sevasetu-backend.onrender.com

databases:
  - name: sevasetu-db
    plan: free
    databaseName: sevasetu
    user: sevasetu
