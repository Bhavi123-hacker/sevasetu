services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - sevasetu_data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/sevasetu.db
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:1b
      - JWT_SECRET_KEY=dev-only-secret-change-before-any-real-deployment
      - OFFICER_DEMO_PASSWORD=seva123
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000
      - OFFICER_DEMO_PASSWORD=seva123
    depends_on:
      - backend
    restart: unless-stopped

  # Optional. The backend works without this — /api/ask falls back to
  # retrieval-only if it's not running or the model hasn't been pulled
  # yet. Start it, then run the one-time pull command in the README
  # before expecting generated answers.
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  sevasetu_data:
  ollama_models:
