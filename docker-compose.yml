services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - sevasetu_data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/sevasetu.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000
      - OFFICER_DEMO_PASSWORD=seva123
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sevasetu_data:
