services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - sevasetu_data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/sevasetu.db
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:1b
      - JWT_SECRET_KEY=dev-only-secret-change-before-any-real-deployment
      - OFFICER_DEMO_PASSWORD=seva123
    restart: unless-stopped
    healthcheck:
      # python3, not curl — python:3.11-slim doesn't ship curl by default,
      # but the Python runtime is guaranteed to be there.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # React is now the only active frontend — full feature parity with
  # the old Streamlit app across all 7 pages, tested (21 component
  # tests, see frontend-react/src/tests/). The Streamlit code is still
  # in frontend/ but deliberately not run by this file anymore.
  # VITE_API_BASE_URL is http://localhost:8000, not http://backend:8000
  # — this gets baked into the JS bundle at build time and is called
  # from the user's browser, which is outside the Docker network.
  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Optional. The backend works without this — /api/ask falls back to
  # retrieval-only if it's not running or the model hasn't been pulled
  # yet. Start it, then run the one-time pull command in the README
  # before expecting generated answers.
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  sevasetu_data:
  ollama_models:
